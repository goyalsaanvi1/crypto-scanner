name: "Crypto Scanner"
description: "Scans Java source files for cryptographic misuse patterns (hardcoded keys, insecure cipher modes, and more)."

inputs:
  path:
    description: "Directory or file to scan"
    required: true
  format:
    description: "Output format: text or sarif"
    required: false
    default: "text"
  fail-on-findings:
    description: "Whether to fail the step if findings are present"
    required: false
    default: "true"

outputs:
  findings-count:
    description: "Total number of findings from the run"
    value: ${{ steps.scan.outputs.findings-count }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install crypto-scanner
      shell: bash
      run: |
        if [ -f "${{ github.action_path }}/pyproject.toml" ]; then
          pip install "${{ github.action_path }}"
        else
          pip install git+https://github.com/goyalsaanvi1/crypto-scanner.git
        fi

    - name: Run crypto-scanner
      id: scan
      shell: bash
      run: |
        set +e

        crypto-scanner --format "${{ inputs.format }}" "${{ inputs.path }}" > scan-output.txt
        exit_code=$?

        cat scan-output.txt

        if [ "${{ inputs.format }}" = "sarif" ]; then
          count=$(python3 -c "import json; print(len(json.load(open('scan-output.txt'))['runs'][0]['results']))")
        else
          count=$(grep -cE '\[[A-Z_]+\] (HIGH|MEDIUM|LOW) -' scan-output.txt)
        fi

        echo "findings-count=$count" >> "$GITHUB_OUTPUT"
        echo "Found $count finding(s)."

        if [ "$exit_code" -eq 2 ]; then
          echo "::error::crypto-scanner exited with a configuration error (exit code 2)."
          exit 2
        fi

        if [ "$exit_code" -eq 1 ] && [ "${{ inputs.fail-on-findings }}" = "false" ]; then
          exit 0
        fi

        exit "$exit_code"
